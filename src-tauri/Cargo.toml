[package]
name = "luma-desktop"
version = "0.1.0"
description = "Light, minimal and elegant Linux desktop application"
authors = ["Luma Team"]
edition = "2021"

[lib]
name = "luma_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "4", features = ["tokio"] }
futures-util = "0.3"
base64 = "0.22"
